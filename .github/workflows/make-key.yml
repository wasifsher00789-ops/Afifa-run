name: Make Key (sirf ek dafa chalana hai)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make fixed signing key
        run: |
          if [ -f debug.keystore ]; then echo "Key pehle se maujood hai, kuch nahi badla"; exit 0; fi
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add debug.keystore
          git commit -m "Add fixed signing key"
          git push
