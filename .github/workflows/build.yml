name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Afifa Run 3D" com.afifa.run3d --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Set icon and portrait
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          res = "android/app/src/main/res"
          img = Image.open("icon.png").convert("RGBA")
          for d, px in [("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)]:
              for n in ["ic_launcher", "ic_launcher_round", "ic_launcher_foreground"]:
                  img.resize((px, px), Image.LANCZOS).save(f"{res}/mipmap-{d}/{n}.png")
          PY
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Afifa-Run-3D.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Afifa Run 3D APK ${{ github.run_number }}
          files: Afifa-Run-3D.apk
